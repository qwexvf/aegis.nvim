name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ tests/

  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: 5.1
      - uses: leafo/gh-actions-luarocks@v4
      - name: install luacheck
        run: luarocks install luacheck
      - name: run
        run: luacheck lua/ tests/ plugin/

  test:
    name: nvim ${{ matrix.nvim }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      # Pinned so a scoring change in aegis shows up as a deliberate bump here,
      # not as a surprise red build.
      - name: install aegis-cli
        env:
          GH_TOKEN: ${{ github.token }}
          AEGIS_VERSION: v0.31.0
        run: |
          asset="aegis-${AEGIS_VERSION}-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          gh release download "$AEGIS_VERSION" --repo qwexvf/aegis-cli \
            --pattern "$asset.tar.gz" --pattern checksums.txt
          grep -E "[ /]$asset\.tar\.gz\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset.tar.gz"
          echo "$RUNNER_TEMP/$asset" >> "$GITHUB_PATH"
      - name: e2e
        run: |
          aegis --version
          tests/run.sh
